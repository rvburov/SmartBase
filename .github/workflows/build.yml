# Полная проверка кода на всех операционных системах: сборка, тесты, живой PostgreSQL.
#
# Запускается ТОЛЬКО по команде — пушем ветки `ci` или кнопкой на вкладке Actions.
# Обычный `git push` не запускает ничего: триггера на main здесь нет намеренно.
#
# Команда на стороне разработчика одна — `git push actions`. Она отправляет main и заодно
# перематывает ветку `ci`; удаленный репозиторий `actions` заводит Scripts/ci/setup-remote.sh,
# один раз в копии репозитория.
#
# Ветка `ci` живет только на время прогона: GitHub умеет ловить push ветки или тега и ничего
# больше, поэтому без нее запуска не сделать, — но последний job ее удаляет, и в репозитории
# постоянно висит одна main. Все checkout'ы поэтому пришпилены к github.sha, а не к ссылке.
#
# С выпуском релиза не пересекается ни во времени, ни по файлам:
#   • выпуск пушит main и тег `v*` — под фильтр `branches: [ci]` не подпадает ни то, ни другое;
#   • отсюда не вызывается ни один скрипт репозитория, только `dotnet` и `psql`.
# Поэтому любой из двух модулей удаляется, не задевая другой.
#
# Описание и порядок удаления — docs/developer/guides/ci.md.
name: Build

on:
  push:
    branches: [ci]
  workflow_dispatch:

permissions:
  contents: read

# Отправили ветку `ci` второй раз, пока идет первый прогон, — старый отменяется, проверяется
# только последний код. Отменять здесь безопасно: прогон ничего не публикует и никуда не пишет.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

# Явный `shell: bash` на весь файл, а не только ради одинакового шелла на трех ОС. Умолчание
# GitHub — `bash -e`, БЕЗ pipefail: в шаге `dotnet test … | tee` код возврата взялся бы от tee,
# и упавшие тесты уехали бы в зеленый прогон. С этой строкой шелл везде `bash -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  # ── Сборка и тесты на каждой операционной системе ───────────────────────────
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Без fail-fast: упавшая платформа не отменяет остальные, иначе за прогон видно одну
      # поломку из четырех — а смысл прогона ровно в том, чтобы увидеть все сразу.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS Apple Silicon }
          # Единственное место, где код вообще ЗАПУСКАЕТСЯ под x86_64-macOS: сборка osx-x64
          # в релизе кросс-компилируется на arm64-раннере, и там проверяется только архитектура
          # бинаря. Здесь под x64 работают нативные SQLite и SkiaSharp.
          #
          # Метка macos-15-intel, а НЕ macos-13: тот образ GitHub вывел в декабре 2025, и job
          # с ним не падает, а бесконечно висит в очереди — раннера с такой меткой просто нет.
          # Нынешняя метка живет до августа 2027, дальше Intel-раннеров у GitHub не будет вовсе.
          - { os: macos-15-intel, name: macOS Intel }
    steps:
      # Пришпилено к коммиту, а не к ссылке: ветка `ci` удаляется в конце прогона, и checkout
      # по `refs/heads/ci` стал бы зависеть от того, кто успел раньше. Коммит же остается
      # достижим из main всегда.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      # Версии v5 у обоих действий, а не v4: те собраны под Node 20, который GitHub объявил
      # устаревшим, и раннер уже принудительно гонит их на Node 24, ругаясь в каждый прогон.
      # v5 собраны под Node 24 штатно.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          # cache НЕ включаем: он выставляет NUGET_PACKAGES и перебивает globalPackagesFolder
          # из nuget.config — поведение CI разошлось бы с локальным. Плата — restore на каждом
          # прогоне, примерно полторы минуты.

      # Собираются ОБА таргета — net10.0 и net10.0-windows10.0.17763. Второй нужен ради нативных
      # тостов и на Linux с macOS компилируется благодаря EnableWindowsTargeting. Тесты его не
      # трогают (Tests/* ссылаются на базовый net10.0), поэтому шаг отдельный.
      #
      # Публикации (single-file, self-contained) здесь нет намеренно: упаковка продукта — работа
      # выпуска релиза, а не проверки кода.
      - name: Сборка приложения
        run: dotnet build SmartBase.csproj --configuration Release

      # Прогон идет на ЧИСТОМ checkout — без artifacts/ и без packages/. Локально `dotnet build`
      # умеет отрапортовать «Ошибок: 0», ничего не перекомпилировав: стоит времени файлов уехать
      # назад (перенос папки, облачный диск), и MSBuild считает сборку свежей. Здесь это невозможно.
      - name: Модульные тесты
        run: dotnet test Tests/Unit --configuration Release --logger 'console;verbosity=minimal'

      # PostgreSQL-стенд здесь не поднимаем — контейнеры-сервисы работают только на Linux-раннерах.
      # Тесты провайдера сами уходят в Skipped (Tests/Integration/PgTestServer.cs проверяет
      # localhost:5455), а по-настоящему их гоняет отдельный job ниже.
      - name: Интеграционные тесты
        run: dotnet test Tests/Integration --configuration Release --logger 'console;verbosity=minimal'

      # Тесты расширений — отдельные сборки, по проекту на расширение (Tests/Extensions/*).
      # Список берется глобом внутри скрипта: заведение и удаление расширения этот файл не
      # задевают. Гоняем на всей матрице ОС осознанно — расширения работают с файловой
      # системой, а именно там платформы и расходятся: регистр расширений файлов, скрытые
      # файлы с ведущей точкой, разделители путей, сортировка по культуре.
      - name: Тесты расширений
        run: bash Tests/run-extensions.sh --configuration Release --logger 'console;verbosity=minimal'

      # Граница между наборами — не соглашение, а проверяемый инвариант: тесты ядра не должны
      # знать ни одного расширения, иначе удаление расширения снова начнет ронять их сборку
      # (ровно с этого и начиналась работа, см. docs/developer/testing/extension-tests.md).
      #
      # Ищутся обращения к КОНКРЕТНОМУ расширению — Extensions.<Имя> с приставкой SmartBase. или без
      # нее (из namespace SmartBase.Tests.* частичное имя тоже компилируется), а имена берутся из
      # папок Extensions/*/: заведение и удаление расширения этот шаг не задевают. Путь вида
      # Tests/Extensions/<Имя> в комментарии не ловится — после Extensions там косая черта.
      #
      # Плюс ExtensionRegistry: он лежит в общем пространстве имен, но создает все настоящие
      # расширения, и тест на нем зависит от их состава. Остальное голое SmartBase.Extensions —
      # общий механизм (IExtension, ExtensionAction): он принадлежит ядру, и тесты сценариев законно
      # работают с ним на стендовых расширениях. Прежний grep по одной приставке этого не различал и
      # краснел на законном using.
      #
      # Найденные строки печатаются — иначе «где-то есть ссылка» пришлось бы искать заново. Код
      # grep разбирается явно: ошибка самого grep (код 2) не должна сойти за «ссылок нет».
      - name: Ядро не знает про расширения
        if: runner.os == 'Linux'
        run: |
          names=$(find Extensions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd '|')
          if [ -z "$names" ]; then echo "расширений нет — сторожить нечего"; exit 0; fi

          status=0
          grep -rnE "(^|[^A-Za-z0-9_])Extensions\.($names)\b|\bExtensionRegistry\b" Tests/Unit Tests/Integration || status=$?

          case $status in
            0) echo "::error::в тестах ядра появилась ссылка на расширение или на их реестр — место таким тестам в Tests/Extensions/"; exit 1 ;;
            1) echo "ссылок на расширения в тестах ядра нет" ;;
            *) echo "::error::grep не отработал (код $status) — проверка ничего не проверила"; exit 1 ;;
          esac

      # Единственное место, где вообще выполняется связка с D-Bus. Пакеты
      # DesktopNotifications.FreeDesktop и Tmds.DBus разъезжаются по версиям молча: сборка
      # проходит, а на машине пользователя менеджер падает, и Program.CreateNotificationManager
      # это исключение проглатывает — приложение стартует, баннеров нет, снаружи не видно.
      #
      # dbus-run-session поднимает шину сеанса на время команды; без нее тест ушел бы в Skipped
      # вместе с обычным прогоном выше. Демон уведомлений не нужен: проверяется, что вызовы
      # доходят до Tmds.DBus, а не что баннер нарисовался.
      - name: Уведомления Linux
        if: runner.os == 'Linux'
        run: |
          command -v dbus-run-session > /dev/null || sudo apt-get install -y -qq dbus
          dbus-run-session -- dotnet test Tests/Integration --configuration Release \
            --filter 'FullyQualifiedName~LinuxNotificationsTests' \
            --logger 'console;verbosity=minimal' | tee dbus.log

      # Тест помечен SkippableFact: без этой проверки не поднявшаяся шина дала бы зеленый шаг,
      # ничего не проверивший, — а именно ради него шаг и добавлен.
      - name: Убедиться, что связка с D-Bus проверена
        if: runner.os == 'Linux'
        run: |
          grep -qE 'Skipped: *0' dbus.log \
            || { echo "::error::тест уведомлений ушел в Skipped — шина D-Bus не поднялась"; exit 1; }

  # ── Сборка для закрытого контура ────────────────────────────────────────────
  # Второй дистрибутив программы: в нем отправляющего слоя нет физически — файл
  # Integrations/EgressHttp.Open.cs исключается из компиляции, а вместо него собирается
  # заглушка EgressHttp.Closed.cs (docs/ROADMAP-API.md, 10.16.1).
  #
  # Зачем отдельный job. Обычная матрица собирает ТОЛЬКО открытую конфигурацию, и заглушка в
  # ней не компилируется вовсе: смени сигнатуру в отправляющем слое — и закрытая сборка
  # ломается молча, а выяснится это при выпуске релиза для закрытого контура, то есть в самый
  # неподходящий момент. Здесь она собирается на каждом прогоне.
  #
  # Устройство подмены стерегут тесты (Tests/Unit/OneDoorOutwardTests.cs): заглушка не должна
  # обзавестись сетевым кодом, строки подмены — пропасть из csproj, а #if CLOSED_LOOP —
  # расползтись за пределы шлюза. Они текстовые и идут в общем наборе, здесь их повторять
  # незачем.
  #
  # Разбора манифеста тут намеренно НЕТ. Отсутствие сетевого кода обеспечено не проверкой
  # собранного, а тем, что исходный файл в компиляцию не попадает, — и решение это записано
  # (ROADMAP-API.md, 10.16.1: «сверка манифеста для этого не нужна»). Проверять следствие там,
  # где проверена причина, значит завести второй рубеж, который однажды разойдется с первым.
  #
  # Один Linux-раннер: подмена файла от операционной системы не зависит, а нативные части
  # закрытая сборка задевает ровно так же, как открытая, — их уже проверила матрица.
  closed-loop:
    name: Закрытый контур
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Пришпилено к коммиту, а не к ссылке: ветка `ci` удаляется в конце прогона.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Сборка закрытого контура
        run: dotnet build SmartBase.csproj --configuration Release -p:ClosedLoop=true

      # Второй флаг того же рода: сборка без слушателя. Вопросы разные — «куда программа ходит»
      # и «кого она к себе пускает», — и сочетают их по обстоятельствам, поэтому собираются обе
      # конфигурации по отдельности и одна вместе.
      - name: Сборка без слушателя
        run: dotnet build SmartBase.csproj --configuration Release -p:NoListener=true

      - name: Сборка закрытого контура без слушателя
        run: dotnet build SmartBase.csproj --configuration Release -p:ClosedLoop=true -p:NoListener=true

      # Встречная проверка: в ОБЫЧНОЙ сборке отправляющий слой на месте. Без нее job остался бы
      # зеленым и в том случае, когда Open-файл потеряли совсем, — закрытая сборка собралась бы
      # как ни в чем не бывало, а вместе с ней исчез бы весь исходящий обмен.
      - name: Оба слоя на месте в обычной сборке
        run: |
          test -f Integrations/EgressHttp.Open.cs \
            || { echo "::error::Integrations/EgressHttp.Open.cs пропал — в обычной сборке не осталось отправляющего слоя"; exit 1; }
          test -f Integrations/IngressHttp.Open.cs \
            || { echo "::error::Integrations/IngressHttp.Open.cs пропал — в обычной сборке не осталось слушателя"; exit 1; }
          dotnet build SmartBase.csproj --configuration Release

  # ── Тесты провайдера PostgreSQL на живой базе ───────────────────────────────
  # Единственное место, где тесты провайдера и создания баз вообще выполняются: локально
  # нужен поднятый docker-контейнер, а на остальных раннерах сервисы недоступны.
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # 5455 снаружи — тот же порт, что у локального стенда, чтобы тесты не знали разницы
        # и в коде не заводилось второй настройки.
        ports: ['5455:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Пришпилено к коммиту, а не к ссылке: ветка `ci` удаляется в конце прогона, и checkout
      # по `refs/heads/ci` стал бы зависеть от того, кто успел раньше. Коммит же остается
      # достижим из main всегда.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Контейнер поднимается с одной базой postgres; тестам нужны две рабочие.
      - name: Базы стенда
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5455 -U postgres -c 'CREATE DATABASE smartbase'
          psql -h localhost -p 5455 -U postgres -c 'CREATE DATABASE smartbase2'

      # Фильтр по классам, а не весь набор: остальное уже прогнано матрицей на четырех ОС,
      # повторять его здесь — впустую жечь минуты.
      - name: Тесты провайдера
        run: |
          dotnet test Tests/Integration --configuration Release \
            --filter 'FullyQualifiedName~PgProviderTests|FullyQualifiedName~PgCreateDatabaseTests|FullyQualifiedName~PgBulkWriteTests' \
            --logger 'console;verbosity=minimal' | tee pg.log

      # Без этой проверки job был бы зеленым и в том случае, когда база не поднялась: тесты
      # помечены SkippableFact и молча уходят в Skipped. Зеленый прогон, не проверивший ничего,
      # хуже красного.
      - name: Убедиться, что тесты не пропущены
        run: |
          grep -qE 'Skipped: *0' pg.log \
            || { echo "::error::тесты PostgreSQL ушли в Skipped — база не поднялась"; exit 1; }

  # ── Вспомогательные проекты ─────────────────────────────────────────────────
  # Генератор стенда, бенчмарки и многопроцессный харнесс в приложение не входят и обычной
  # сборкой не затрагиваются. Из-за этого они тихо гниют: правка в модели ломает их, и это
  # выясняется через полгода, когда стенд понадобился срочно. Один Linux-раннер, четыре минуты.
  tools:
    name: Вспомогательные проекты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Пришпилено к коммиту, а не к ссылке: ветка `ci` удаляется в конце прогона, и checkout
      # по `refs/heads/ci` стал бы зависеть от того, кто успел раньше. Коммит же остается
      # достижим из main всегда.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: |
          dotnet build Tests/Benchmarks   --configuration Release
          dotnet build Tests/DbGenerator  --configuration Release
          dotnet build Tests/MultiProcess --configuration Release

  # ── Уборка служебной ветки ──────────────────────────────────────────────────
  # Ветка `ci` нужна ровно затем, чтобы у запуска был сигнал: GitHub ловит push ветки или тега
  # и ничего больше. Существовать после прогона ей незачем — в репозитории должна оставаться
  # одна main.
  #
  # Единственный job с правом записи, и право узкое: удалить одну ссылку. Ни релиз, ни код,
  # ни настройки ему недоступны.
  cleanup:
    name: Убрать ветку ci
    needs: [test, closed-loop, postgres, tools]
    # always(): ветка должна исчезнуть и после красного прогона, и после отмененного — иначе
    # ровно неудачные запуски и оставляли бы за собой мусор.
    # Проверка ссылки: при ручном запуске с main удалять нечего и не нужно.
    if: always() && github.ref == 'refs/heads/ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Через API, а не `git push --delete`: checkout здесь не нужен вовсе — ни одного файла
      # репозитория этот job не читает.
      - name: Удалить ветку
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ci" 2>err.log; then
            echo "ветка ci удалена"
          else
            # Не ошибка: ветку мог уже убрать предыдущий прогон, отмененный по concurrency.
            # Валить из-за этого зеленую проверку кода нельзя — предупреждения достаточно,
            # а следующий `git push actions` пересоздаст ветку и уберет ее снова.
            echo "::warning::не удалось удалить ветку ci: $(cat err.log)"
          fi
