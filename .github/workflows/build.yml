# Единая проверка: ветки/PR — быстрый профиль, ci/manual/release reuse — полный.
# Ничего не публикует и не удаляет ветки. Выпуск отдельно вызывает этот workflow с full:true.
name: Проверки

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: 'Полная проверка перед выпуском'
        type: boolean
        default: true
      ref:
        description: 'Неизменяемый SHA для проверки; выпуск передает SHA разрешенного тега'
        type: string
        default: ''
    outputs:
      profile:
        description: 'Выполненный профиль: quick или full'
        value: ${{ jobs.scope.outputs.profile }}

permissions:
  contents: read

# Быстрый push и его PR делят группу; чужая fork-ветка и ручная полная проверка — отдельные.
concurrency:
  group: checks-${{ github.workflow }}-${{ (inputs.full || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ci') && 'full' || 'quick' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ inputs.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # LANG задает культуру Linux; Windows/macOS могут использовать системную культуру.
  # Тесты с ожиданиями конкретного формата задают CurrentCulture явно.
  LANG: ru_RU.UTF-8

# Явный `shell: bash` на весь файл, а не только ради одинакового шелла на трех ОС. Умолчание
# GitHub — `bash -e`, БЕЗ pipefail: в шаге `dotnet test … | tee` код возврата взялся бы от tee,
# и упавшие тесты уехали бы в зеленый прогон. С этой строкой шелл везде `bash -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  scope:
    name: Выбрать профиль
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Проверка модуля CI
        run: bash Scripts/ci/ci-test.sh
      - id: scope
        env:
          WORKFLOW_FULL: ${{ inputs.full || false }}
        run: bash Scripts/ci/select-scope.sh >> "$GITHUB_OUTPUT"

  agent-tests:
    name: Unit и расширения (Linux)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Модульные тесты
        run: dotnet test Tests/Unit --configuration Release --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=unit.trx' --results-directory "$RUNNER_TEMP/quick-results"
      - name: Тесты расширений
        run: bash Tests/run-extensions.sh --configuration Release --logger 'console;verbosity=minimal' --logger trx --results-directory "$RUNNER_TEMP/extensions-results"
      - name: Имена и сообщения упавших тестов
        if: failure()
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP/quick-results/"*.trx "$RUNNER_TEMP/extensions-results/"*.trx)
          python Scripts/ci/report-failures.py "${reports[@]}"

  # ── Сборка и тесты на каждой операционной системе ───────────────────────────
  test:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Без fail-fast: упавшая платформа не отменяет остальные, иначе за прогон видно одну
      # поломку из четырех — а смысл прогона ровно в том, чтобы увидеть все сразу.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }
          - { os: macos-latest,   name: macOS Apple Silicon }
          # Единственное место, где код вообще ЗАПУСКАЕТСЯ под x86_64-macOS: сборка osx-x64
          # в релизе кросс-компилируется на arm64-раннере, и там проверяется только архитектура
          # бинаря. Здесь под x64 работают нативные SQLite и SkiaSharp.
          #
          # Метка macos-15-intel, а НЕ macos-13: тот образ GitHub вывел в декабре 2025, и job
          # с ним не падает, а бесконечно висит в очереди — раннера с такой меткой просто нет.
          # Нынешняя метка живет до августа 2027, дальше Intel-раннеров у GitHub не будет вовсе.
          - { os: macos-15-intel, name: macOS Intel }
    steps:
      # Все jobs проверяют один SHA, даже если ветку успели обновить во время прогона.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Версии v5 у обоих действий, а не v4: те собраны под Node 20, который GitHub объявил
      # устаревшим, и раннер уже принудительно гонит их на Node 24, ругаясь в каждый прогон.
      # v5 собраны под Node 24 штатно.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          # cache НЕ включаем: он выставляет NUGET_PACKAGES и перебивает globalPackagesFolder
          # из nuget.config — поведение CI разошлось бы с локальным. Плата — restore на каждом
          # прогоне, примерно полторы минуты.

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Собираются ОБА таргета — net10.0 и net10.0-windows10.0.17763. Второй нужен ради нативных
      # тостов и на Linux с macOS компилируется благодаря EnableWindowsTargeting. Тесты его не
      # трогают (Tests/* ссылаются на базовый net10.0), поэтому шаг отдельный.
      #
      # Публикации (single-file, self-contained) здесь нет намеренно: упаковка продукта — работа
      # выпуска релиза, а не проверки кода.
      - name: Сборка приложения
        run: dotnet build SmartBase.csproj --configuration Release

      # Прогон идет на ЧИСТОМ checkout — без artifacts/ и без packages/. Локально `dotnet build`
      # умеет отрапортовать «Ошибок: 0», ничего не перекомпилировав: стоит времени файлов уехать
      # назад (перенос папки, облачный диск), и MSBuild считает сборку свежей. Здесь это невозможно.
      - name: Модульные тесты
        run: dotnet test Tests/Unit --configuration Release --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=unit.trx' --results-directory "$RUNNER_TEMP/matrix-results"

      # PostgreSQL-стенд здесь не поднимаем — контейнеры-сервисы работают только на Linux-раннерах.
      # Тесты провайдера сами уходят в Skipped (Tests/Integration/PgTestServer.cs проверяет
      # localhost:5455), а по-настоящему их гоняет отдельный job ниже.
      - name: Интеграционные тесты
        run: dotnet test Tests/Integration --configuration Release --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=integration.trx' --results-directory "$RUNNER_TEMP/matrix-results"

      # Тесты расширений — отдельные сборки, по проекту на расширение (Tests/Extensions/*).
      # Список берется глобом внутри скрипта: заведение и удаление расширения этот файл не
      # задевают. Гоняем на всей матрице ОС осознанно — расширения работают с файловой
      # системой, а именно там платформы и расходятся: регистр расширений файлов, скрытые
      # файлы с ведущей точкой, разделители путей, сортировка по культуре.
      # TRX без LogFileName получает уникальное имя для каждого проекта, общий файл не затирается.
      - name: Тесты расширений
        run: bash Tests/run-extensions.sh --configuration Release --logger 'console;verbosity=minimal' --logger trx --results-directory "$RUNNER_TEMP/extensions-results"

      # Граница между наборами — не соглашение, а проверяемый инвариант: тесты ядра не должны
      # знать ни одного расширения, иначе удаление расширения снова начнет ронять их сборку
      # (ровно с этого и начиналась работа, см. docs/developer/testing/extension-tests.md).
      #
      # Ищутся обращения к КОНКРЕТНОМУ расширению — Extensions.<Имя> с приставкой SmartBase. или без
      # нее (из namespace SmartBase.Tests.* частичное имя тоже компилируется), а имена берутся из
      # папок Extensions/*/: заведение и удаление расширения этот шаг не задевают. Путь вида
      # Tests/Extensions/<Имя> в комментарии не ловится — после Extensions там косая черта.
      #
      # Плюс ExtensionRegistry: он лежит в общем пространстве имен, но создает все настоящие
      # расширения, и тест на нем зависит от их состава. Остальное голое SmartBase.Extensions —
      # общий механизм (IExtension, ExtensionAction): он принадлежит ядру, и тесты сценариев законно
      # работают с ним на стендовых расширениях. Прежний grep по одной приставке этого не различал и
      # краснел на законном using.
      #
      # Найденные строки печатаются — иначе «где-то есть ссылка» пришлось бы искать заново. Код
      # grep разбирается явно: ошибка самого grep (код 2) не должна сойти за «ссылок нет».
      - name: Ядро не знает про расширения
        if: runner.os == 'Linux'
        run: |
          names=$(find Extensions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd '|')
          if [ -z "$names" ]; then echo "расширений нет — сторожить нечего"; exit 0; fi

          status=0
          grep -rnE "(^|[^A-Za-z0-9_])Extensions\.($names)\b|\bExtensionRegistry\b" Tests/Unit Tests/Integration || status=$?

          case $status in
            0) echo "::error::в тестах ядра появилась ссылка на расширение или на их реестр — место таким тестам в Tests/Extensions/"; exit 1 ;;
            1) echo "ссылок на расширения в тестах ядра нет" ;;
            *) echo "::error::grep не отработал (код $status) — проверка ничего не проверила"; exit 1 ;;
          esac

      # Единственное место, где вообще выполняется связка с D-Bus. Пакеты
      # DesktopNotifications.FreeDesktop и Tmds.DBus разъезжаются по версиям молча: сборка
      # проходит, а на машине пользователя менеджер падает, и Program.CreateNotificationManager
      # это исключение проглатывает — приложение стартует, баннеров нет, снаружи не видно.
      #
      # dbus-run-session поднимает шину сеанса на время команды; без нее тест ушел бы в Skipped
      # вместе с обычным прогоном выше. Демон уведомлений не нужен: проверяется, что вызовы
      # доходят до Tmds.DBus, а не что баннер нарисовался.
      - name: Уведомления Linux
        if: runner.os == 'Linux'
        run: |
          command -v dbus-run-session > /dev/null || sudo apt-get install -y -qq dbus
          dbus-run-session -- dotnet test Tests/Integration --configuration Release \
            --filter 'FullyQualifiedName~LinuxNotificationsTests' \
            --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=dbus.trx' \
            --results-directory "$RUNNER_TEMP/dbus-results"

      # Тест помечен SkippableFact: без этой проверки не поднявшаяся шина дала бы зеленый шаг,
      # ничего не проверивший, — а именно ради него шаг и добавлен.
      - name: Убедиться, что связка с D-Bus проверена
        if: runner.os == 'Linux'
        run: python3 Scripts/ci/check-trx.py "$RUNNER_TEMP/dbus-results/dbus.trx"

      - name: Имена и сообщения упавших тестов
        if: failure()
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP/matrix-results/"*.trx "$RUNNER_TEMP/extensions-results/"*.trx)
          python Scripts/ci/report-failures.py "${reports[@]}"

  # Проверяем отдельный вариант упаковки без входящего HTTP-слушателя.
  no-listener:
    name: Без HTTP-слушателя
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Сборка без слушателя
        run: dotnet build SmartBase.csproj --configuration Release -p:NoListener=true
      - name: Обычная сборка с HTTP-слоем
        run: dotnet build SmartBase.csproj --configuration Release

  # ── Тесты провайдера PostgreSQL на живой базе ───────────────────────────────
  # Единственное место, где тесты провайдера и создания баз вообще выполняются: локально
  # нужен поднятый docker-контейнер, а на остальных раннерах сервисы недоступны.
  postgres:
    name: PostgreSQL
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        # 5455 снаружи — тот же порт, что у локального стенда, чтобы тесты не знали разницы
        # и в коде не заводилось второй настройки.
        ports: ['5455:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Ubuntu 24.04 содержит официальный client-16 той же версии, что у контейнера.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Сервер остается в проверенном контейнере; backup/recovery используют настоящие
      # pg_dump/pg_restore той же основной версии, а не случайный клиент из PATH раннера.
      - name: Нативные клиенты PostgreSQL 16 и D-Bus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 dbus
          # PgDump сначала ищет /usr/bin; Debian-wrapper иначе может выбрать клиент 17/18.
          sudo ln -sf /usr/lib/postgresql/16/bin/pg_dump /usr/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/16/bin/pg_restore /usr/bin/pg_restore
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
          /usr/bin/pg_dump --version | tee "$RUNNER_TEMP/pg-dump-version"
          /usr/bin/pg_restore --version | tee "$RUNNER_TEMP/pg-restore-version"
          grep -qE '\(PostgreSQL\) 16\.' "$RUNNER_TEMP/pg-dump-version"
          grep -qE '\(PostgreSQL\) 16\.' "$RUNNER_TEMP/pg-restore-version"

      # Контейнер поднимается с одной базой postgres; тестам нужны две рабочие.
      - name: Базы стенда
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5455 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE smartbase'
          psql -h localhost -p 5455 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE smartbase2'

      # Весь набор, без списка классов: новые PG-теории библиотеки/связей/целостности иначе
      # молча пропускались бы и здесь, и в матрице без сервера.
      - name: Интеграционные тесты с PostgreSQL
        run: |
          dbus-run-session -- dotnet test Tests/Integration --configuration Release \
            --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=postgres.trx' \
            --results-directory "$RUNNER_TEMP/pg-results"

      # Без этой проверки job был бы зеленым и в том случае, когда база не поднялась: тесты
      # помечены SkippableFact и молча уходят в Skipped. Зеленый прогон, не проверивший ничего,
      # хуже красного.
      - name: Убедиться, что PostgreSQL и нативные клиенты проверены
        run: python3 Scripts/ci/check-trx.py "$RUNNER_TEMP/pg-results/postgres.trx" --postgres

  # ── Вспомогательные проекты ─────────────────────────────────────────────────
  # Генератор стенда, бенчмарки, многопроцессный харнесс и стенд панели чтения в приложение не
  # входят и обычной сборкой не затрагиваются. Из-за этого они тихо гниют: правка в модели
  # ломает их, и это выясняется через полгода, когда стенд понадобился срочно. Стенд панели
  # чтения и проверки связей страницы записи здесь еще и ПРОГОНЯЮТСЯ. Один Linux-раннер.
  tools:
    name: Вспомогательные проекты
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Тот же SHA, что у остальных проверок.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        run: |
          dotnet build Tests/Benchmarks   --configuration Release
          dotnet build Tests/DbGenerator  --configuration Release
          dotnet build Tests/MultiProcess --configuration Release
          dotnet build Tests/DocReader    --configuration Release
          dotnet build Tests/Sections     --configuration Release
          dotnet build Tests/BackupUi     --configuration Release
          dotnet build Tests/ConcurrentUi --configuration Release
          dotnet build Tests/TasksQuickAdd --configuration Release
          dotnet build Tests/WindowPlacement --configuration Release
          dotnet build Tests/RecordPage --framework net10.0 --configuration Release

      # Живая Avalonia без экрана: разметка панели, подсветка, переходы по совпадениям, страницы
      # PDF и таблица книги. Расхождение — код возврата 1, и job краснеет; сводка по разделам —
      # в конце вывода шага.
      - name: Стенд панели чтения
        run: dotnet run --project Tests/DocReader --configuration Release --no-build

      - name: Размещение окон и динамические формы
        run: dotnet run --project Tests/WindowPlacement --configuration Release --no-build

      - name: Размещение окон расширений
        run: |
          shopt -s nullglob
          for project in Tests/Extensions/*/WindowPlacement/*.csproj; do
            dotnet run --project "$project" --configuration Release
          done

      - name: Фильтр баз в разделах
        run: dotnet run --project Tests/Sections --configuration Release --no-build -- --only sidebarfilter

      - name: Настройки резервных копий и фоновые работы
        run: dotnet run --project Tests/BackupUi --configuration Release --no-build

      - name: Быстрое добавление задач
        run: dotnet run --project Tests/TasksQuickAdd --configuration Release --no-build -- --out "$RUNNER_TEMP/tasks-quickadd"

      - name: Фоновые задачи и уведомления под нагрузкой
        run: dotnet run --project Tests/ConcurrentUi --configuration Release --no-build -- --out "$RUNNER_TEMP/concurrent-ui"

      - name: Отчет фонового UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-ui
          path: ${{ runner.temp }}/concurrent-ui
          if-no-files-found: ignore

      # Эти режимы сами создают базы стенда. Явные out/ref не пишут в домашний каталог.
      - name: Профиль и история без экранов доступа
        run: dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only profile --out "$RUNNER_TEMP/profile-ui"

      - name: Свойства страницы записи
        run: |
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only relations --out "$RUNNER_TEMP/relation-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only relationcomputed --out "$RUNNER_TEMP/relation-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only dateperiod --out "$RUNNER_TEMP/date-period-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only relationintegrity --out "$RUNNER_TEMP/relation-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only backlinks --out "$RUNNER_TEMP/relation-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only fileauto --out "$RUNNER_TEMP/file-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only fileprobe --out "$RUNNER_TEMP/file-ui" --ref "$RUNNER_TEMP/ui-reference"
          dotnet run --project Tests/RecordPage --framework net10.0 --configuration Release --no-build -- --only fileload --files 100000 --out "$RUNNER_TEMP/file-ui" --ref "$RUNNER_TEMP/ui-reference"

  # Нельзя получить зеленый workflow, потеряв обязательный job из-за условия/needs.
  checks:
    name: Итог проверок
    needs: [scope, agent-tests, test, no-listener, postgres, tools]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Все обязательные проверки завершены
        env:
          CI_REQUIRE_FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ci' }}
          CI_PROFILE: ${{ needs.scope.outputs.profile }}
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
          CI_QUICK_RESULT: ${{ needs.agent-tests.result }}
          CI_MATRIX_RESULT: ${{ needs.test.result }}
          CI_LISTENER_RESULT: ${{ needs.no-listener.result }}
          CI_POSTGRES_RESULT: ${{ needs.postgres.result }}
          CI_TOOLS_RESULT: ${{ needs.tools.result }}
        run: bash Scripts/ci/check-results.sh
